[project]
name = "rewind"
version = "0.1.0"
description = "Causal time-travel debugging for Node.js"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rewind = "rewind.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rewind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
